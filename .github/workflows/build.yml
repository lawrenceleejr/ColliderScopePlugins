name: build

on:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  core:
    name: core tests (linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCS_BUILD_PLUGINS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-renders-linux-x86_64
          path: build/renders
          if-no-files-found: warn

  macos:
    name: plugins (macOS universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCS_COPY_PLUGINS=ON

      - name: Build
        run: cmake --build build

      - name: Core unit tests and command-line renders
        run: |
          ctest --test-dir build --output-on-failure
          # CPU and display cost on this runner, for the log
          build/tests/cscore_rt_tests "[realtime]" | grep -E "of a core|passed|failed" || true

      - name: Collect plugins
        run: |
          mkdir -p dist
          find build/plugins \( -name '*.vst3' -o -name '*.component' \) -maxdepth 6 -prune -exec cp -R {} dist/ \;
          ls -la dist
          for name in "CS Chamber" "CS Mux" "CS Bubble" "CS Orbital" "CS Script"; do
            test -d "dist/$name.vst3"
            test -d "dist/$name.component"
            for bin in "dist/$name.vst3/Contents/MacOS/$name" "dist/$name.component/Contents/MacOS/$name"; do
              archs=$(lipo -archs "$bin")
              echo "$bin: $archs"
              [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
            done
          done

      - name: pluginval (VST3, strictness 5)
        run: |
          curl -fsSL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q pluginval.zip
          for name in "CS Chamber" "CS Mux" "CS Bubble" "CS Orbital" "CS Script"; do
            pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process \
              --output-dir pluginval-logs --validate "dist/$name.vst3"
          done

      - name: auval (AU)
        run: |
          ls -la ~/Library/Audio/Plug-Ins/Components
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Chmb Clsc
          auval -v aumf CMux Clsc
          auval -v aumu Bubl Clsc
          auval -v aumu Orbt Clsc
          auval -v aumu Scrp Clsc

      - name: UI snapshots
        run: |
          mkdir -p ui
          root=$PWD/build/plugins
          cd ui
          "$root/chamber/cschamber_uisnap_artefacts/Release/cschamber_uisnap" cs_chamber_shared.png
          "$root/chamber/cschamber_uisnap_artefacts/Release/cschamber_uisnap" cs_chamber_drone.png wallMode=Drone type=Electron
          "$root/mux/csmux_uisnap_artefacts/Release/csmux_uisnap" cs_mux_interleave.png
          "$root/mux/csmux_uisnap_artefacts/Release/csmux_uisnap" cs_mux_cycle_lock.png mode=Cycle-lock
          "$root/bubble/csbubble_uisnap_artefacts/Release/csbubble_uisnap" cs_bubble.png
          "$root/orbital/csorbital_uisnap_artefacts/Release/csorbital_uisnap" cs_orbital_3dz2.png orbital=3dz2
          "$root/orbital/csorbital_uisnap_artefacts/Release/csorbital_uisnap" cs_orbital_4f.png orbital=4fxz2
          "$root/script/csscript_uisnap_artefacts/Release/csscript_uisnap" cs_script.png

      - name: Package
        run: |
          cd dist
          for name in "CS Chamber" "CS Mux" "CS Bubble" "CS Orbital" "CS Script"; do
            ditto -c -k --keepParent "$name.vst3" "${name// /-}-macOS-universal-vst3.zip"
            ditto -c -k --keepParent "$name.component" "${name// /-}-macOS-universal-au.zip"
          done
          ls -la *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ColliderScope-macOS-universal
          path: dist/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-renders-macOS-arm64
          path: build/renders
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: ui
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginval-logs
          path: pluginval-logs
          if-no-files-found: ignore

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ColliderScope-macOS-universal
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
